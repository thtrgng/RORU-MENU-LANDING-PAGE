<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RORU — Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f0ea;
      color: #1e1916;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      min-height: 100vh;
    }

    /* Header */
    header {
      text-align: center;
      padding: 72px 24px 56px;
      border-bottom: 1px solid #c9b99a;
    }

    header .eyebrow {
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #8b7355;
      margin-bottom: 20px;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 300;
      font-size: clamp(40px, 8vw, 72px);
      letter-spacing: 12px;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 20px;
    }

    header .rule {
      width: 40px;
      height: 1px;
      background: #c9b99a;
      margin: 0 auto 20px;
    }

    header .tagline {
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #8b7355;
    }

    /* Nav */
    nav {
      display: flex;
      justify-content: center;
      gap: 48px;
      padding: 24px;
      border-bottom: 1px solid #c9b99a;
    }

    nav a {
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #8b7355;
      text-decoration: none;
      transition: color 0.2s;
    }

    nav a:hover { color: #1e1916; }

    /* Menu section */
    .menu-section {
      padding: 72px 0;
      border-bottom: 1px solid #c9b99a;
    }

    .menu-section:last-of-type { border-bottom: none; }

    .section-header {
      text-align: center;
      padding: 0 24px 56px;
    }

    .section-header .number {
      font-size: 10px;
      letter-spacing: 5px;
      color: #8b7355;
      margin-bottom: 16px;
    }

    .section-header h2 {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: clamp(22px, 4vw, 32px);
      letter-spacing: 2px;
      margin-bottom: 16px;
    }

    .section-header .rule {
      width: 32px;
      height: 1px;
      background: #c9b99a;
      margin: 0 auto;
    }

    /* Page images */
    .pages {
      display: grid;
      gap: 2px;
      padding: 0 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .pages.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .pages.cols-3 { grid-template-columns: repeat(3, 1fr); }

    .pages img {
      width: 100%;
      display: block;
      box-shadow: 0 2px 24px rgba(0,0,0,0.08);
    }

    /* Footer */
    footer {
      padding: 40px 24px;
      text-align: center;
    }

    footer p {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #8b7355;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .pages.cols-2,
      .pages.cols-3 { grid-template-columns: 1fr; }

      nav { gap: 24px; flex-wrap: wrap; }

      header { padding: 56px 24px 40px; }
    }
  </style>
</head>
<body>

  <header>
    <p class="eyebrow">Hanoi, Vietnam</p>
    <h1>Roru</h1>
    <div class="rule"></div>
    <p class="tagline">Omakase &middot; Sushi &middot; Sake</p>
  </header>

  <nav>
    <a href="#omakase">Omakase</a>
    <a href="#alacarte">A La Carte</a>
    <a href="#drinks">Drinks</a>
  </nav>

  <main>

    <section class="menu-section" id="omakase">
      <div class="section-header">
        <p class="number">01</p>
        <h2>Omakase Spring Summer 2026</h2>
        <div class="rule"></div>
      </div>
      <div class="pages cols-3">
        <img src="images/omakase-1.jpg" alt="Omakase menu page 1" loading="lazy">
        <img src="images/omakase-2.jpg" alt="Omakase menu page 2" loading="lazy">
        <img src="images/omakase-3.jpg" alt="Omakase menu page 3" loading="lazy">
        <img src="images/omakase-4.jpg" alt="Omakase menu page 4" loading="lazy">
        <img src="images/omakase-5.jpg" alt="Omakase menu page 5" loading="lazy">
        <img src="images/omakase-6.jpg" alt="Omakase menu page 6" loading="lazy">
      </div>
    </section>

    <section class="menu-section" id="alacarte">
      <div class="section-header">
        <p class="number">02</p>
        <h2>A La Carte Menu</h2>
        <div class="rule"></div>
      </div>
      <div class="pages cols-2">
        <img src="images/alacarte-1.jpg" alt="A La Carte menu page 1" loading="lazy">
        <img src="images/alacarte-2.jpg" alt="A La Carte menu page 2" loading="lazy">
      </div>
    </section>

    <section class="menu-section" id="drinks">
      <div class="section-header">
        <p class="number">03</p>
        <h2>Drinks Menu</h2>
        <div class="rule"></div>
      </div>
      <div class="pages cols-2">
        <img src="images/drinks-1.jpg" alt="Drinks menu page 1" loading="lazy">
        <img src="images/drinks-2.jpg" alt="Drinks menu page 2" loading="lazy">
      </div>
    </section>

  </main>

  <footer>
    <p>Price excludes 5% service charge &amp; government taxes</p>
  </footer>

</body>
</html>
