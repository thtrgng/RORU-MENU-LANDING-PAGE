<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>RORU — Modern Japanese Restaurant</title>
  <style>
    @font-face {
      font-family: 'Manrope';
      src: url('fonts/Manrope-Light.ttf') format('truetype');
      font-weight: 300;
      font-display: swap;
    }
    @font-face {
      font-family: 'Manrope';
      src: url('fonts/Manrope-SemiBold.ttf') format('truetype');
      font-weight: 600;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0a0a0a;
      color: #f0ede8;
      font-family: 'Manrope', -apple-system, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    /* ── Page ─────────────────────────────────────────── */
    .page {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 24px 40px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── Avatar ───────────────────────────────────────── */
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #1a1a1a;
      border: 2.5px solid #e8534a;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 68px;
      height: 68px;
      object-fit: contain;
    }

    /* ── Profile text ─────────────────────────────────── */
    .profile-name {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #f0ede8;
      margin-bottom: 6px;
    }

    .profile-sub {
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(240,237,232,0.5);
      margin-bottom: 6px;
    }

    .profile-slogan {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #e8534a;
      margin-bottom: 40px;
    }

    /* ── Buttons ──────────────────────────────────────── */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 18px 20px;
      color: #f0ede8;
      font-family: 'Manrope', -apple-system, sans-serif;
      font-weight: 300;
      font-size: 15px;
      letter-spacing: 0.3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      transition: background 0.15s ease, border-color 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      position: relative;
      overflow: hidden;
    }

    .link-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0);
      transition: background 0.1s;
    }

    .link-btn:active::after {
      background: rgba(255,255,255,0.06);
    }

    .link-btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.18);
    }

    .link-btn:active {
      transform: scale(0.984);
    }

    .btn-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(232,83,74,0.15);
      border: 1px solid rgba(232,83,74,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      color: #e8534a;
      flex-shrink: 0;
      letter-spacing: 0;
    }

    .btn-label {
      flex: 1;
    }

    .btn-arrow {
      color: rgba(240,237,232,0.3);
      font-size: 18px;
      transition: transform 0.15s, color 0.15s;
    }

    .link-btn:hover .btn-arrow {
      transform: translateX(3px);
      color: rgba(240,237,232,0.6);
    }

    /* ── Footer ───────────────────────────────────────── */
    .footer {
      margin-top: 48px;
      text-align: center;
    }

    .footer p {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(240,237,232,0.2);
    }

    /* ── Backdrop ─────────────────────────────────────── */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .backdrop.show {
      opacity: 1;
      pointer-events: all;
    }

    /* ── Bottom sheet ─────────────────────────────────── */
    .sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: #111;
      border-radius: 20px 20px 0 0;
      transform: translateY(100%);
      transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: 92svh;
      display: flex;
      flex-direction: column;
      will-change: transform;
    }

    .sheet.open {
      transform: translateY(0);
    }

    .sheet-handle-wrap {
      padding: 12px 0 4px;
      display: flex;
      justify-content: center;
      flex-shrink: 0;
      cursor: grab;
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: rgba(240,237,232,0.2);
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 20px 16px;
      flex-shrink: 0;
    }

    .sheet-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(240,237,232,0.7);
    }

    .sheet-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: none;
      color: rgba(240,237,232,0.6);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background 0.15s;
    }

    .sheet-close:active { background: rgba(255,255,255,0.15); }

    /* ── Swipeable image track ────────────────────────── */
    .sheet-viewport {
      flex: 1;
      overflow: hidden;
      position: relative;
      min-height: 0;
    }

    .sheet-track {
      display: flex;
      height: 100%;
      will-change: transform;
      transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .sheet-track.dragging {
      transition: none;
    }

    .sheet-slide {
      flex: 0 0 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .sheet-slide img {
      width: 100%;
      max-width: 520px;
      height: auto;
      display: block;
      border-radius: 8px;
      object-fit: contain;
    }

    /* ── Dots ─────────────────────────────────────────── */
    .sheet-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 14px 0 max(16px, env(safe-area-inset-bottom));
      flex-shrink: 0;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 3px;
      background: rgba(240,237,232,0.2);
      transition: background 0.2s, width 0.2s;
      border: none;
      padding: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .dot.active {
      background: #e8534a;
      width: 18px;
    }

    /* ── Ripple on button tap ─────────────────────────── */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      transform: scale(0);
      animation: ripple 0.45s ease-out forwards;
      pointer-events: none;
    }

    @keyframes ripple {
      to { transform: scale(4); opacity: 0; }
    }
  </style>
</head>
<body>

  <main class="page">
    <div class="avatar">
      <img src="logo-white.png" alt="RORU" width="68" height="68">
    </div>
    <h1 class="profile-name">RORU</h1>
    <p class="profile-sub">Modern Japanese Restaurant</p>
    <p class="profile-slogan">One Time, One Roll</p>

    <div class="links">
      <button class="link-btn" data-menu="omakase">
        <span class="btn-num">01</span>
        <span class="btn-label">Omakase Spring Summer 2026</span>
        <span class="btn-arrow">›</span>
      </button>
      <button class="link-btn" data-menu="alacarte">
        <span class="btn-num">02</span>
        <span class="btn-label">A La Carte Menu</span>
        <span class="btn-arrow">›</span>
      </button>
      <button class="link-btn" data-menu="drinks">
        <span class="btn-num">03</span>
        <span class="btn-label">Drinks Menu</span>
        <span class="btn-arrow">›</span>
      </button>
    </div>

    <footer class="footer">
      <p>Price excludes 5% service charge &amp; government taxes</p>
    </footer>
  </main>

  <div class="backdrop" id="backdrop"></div>

  <div class="sheet" id="sheet">
    <div class="sheet-handle-wrap" id="sheetHandle">
      <div class="sheet-handle"></div>
    </div>
    <div class="sheet-header">
      <span class="sheet-title" id="sheetTitle"></span>
      <button class="sheet-close" id="sheetClose">&#215;</button>
    </div>
    <div class="sheet-viewport">
      <div class="sheet-track" id="sheetTrack"></div>
    </div>
    <div class="sheet-dots" id="sheetDots"></div>
  </div>

  <script>
    const menus = {
      omakase: {
        label: 'Omakase — Spring Summer 2026',
        pages: [
          'images/omakase-1.jpg',
          'images/omakase-2.jpg',
          'images/omakase-3.jpg',
          'images/omakase-4.jpg',
          'images/omakase-5.jpg',
          'images/omakase-6.jpg',
        ]
      },
      alacarte: {
        label: 'A La Carte',
        pages: ['images/alacarte-1.jpg', 'images/alacarte-2.jpg']
      },
      drinks: {
        label: 'Drinks Menu',
        pages: ['images/drinks-1.jpg', 'images/drinks-2.jpg']
      }
    };

    const sheet     = document.getElementById('sheet');
    const backdrop  = document.getElementById('backdrop');
    const track     = document.getElementById('sheetTrack');
    const dotsEl    = document.getElementById('sheetDots');
    const titleEl   = document.getElementById('sheetTitle');
    const closeBtn  = document.getElementById('sheetClose');
    const handleEl  = document.getElementById('sheetHandle');

    let cur = { key: null, idx: 0, pages: [] };
    let isOpen = false;

    // ── Open / close ──────────────────────────────────────
    function openSheet(key) {
      const menu = menus[key];
      cur = { key, idx: 0, pages: menu.pages };
      titleEl.textContent = menu.label;

      track.innerHTML = menu.pages.map((src, i) =>
        `<div class="sheet-slide"><img src="${src}" alt="Page ${i+1}" loading="${i === 0 ? 'eager' : 'lazy'}"></div>`
      ).join('');

      setSlide(0, false);
      renderDots();

      sheet.classList.add('open');
      backdrop.classList.add('show');
      document.body.style.overflow = 'hidden';
      isOpen = true;
    }

    function closeSheet() {
      sheet.classList.remove('open');
      backdrop.classList.remove('show');
      document.body.style.overflow = '';
      isOpen = false;
    }

    function setSlide(idx, animate = true) {
      cur.idx = idx;
      track.classList.toggle('dragging', !animate);
      track.style.transform = `translateX(${-idx * 100}%)`;
      if (!animate) {
        // Force reflow then re-enable transition
        track.getBoundingClientRect();
        track.classList.remove('dragging');
      }
      renderDots();
    }

    function renderDots() {
      dotsEl.innerHTML = cur.pages.map((_, i) =>
        `<button class="dot ${i === cur.idx ? 'active' : ''}" aria-label="Page ${i+1}"></button>`
      ).join('');
      dotsEl.querySelectorAll('.dot').forEach((d, i) => {
        d.addEventListener('click', () => setSlide(i));
      });
    }

    // ── Button taps + ripple ──────────────────────────────
    document.querySelectorAll('.link-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        // Ripple effect
        const rect = btn.getBoundingClientRect();
        const x = (e.clientX || rect.left + rect.width / 2) - rect.left;
        const y = (e.clientY || rect.top + rect.height / 2) - rect.top;
        const size = Math.max(rect.width, rect.height);
        const r = document.createElement('span');
        r.className = 'ripple';
        r.style.cssText = `width:${size}px;height:${size}px;left:${x - size/2}px;top:${y - size/2}px`;
        btn.appendChild(r);
        r.addEventListener('animationend', () => r.remove());

        openSheet(btn.dataset.menu);
      });
    });

    closeBtn.addEventListener('click', closeSheet);
    backdrop.addEventListener('click', closeSheet);

    // ── Swipe on track ────────────────────────────────────
    let dragStart = null;
    let sheetStartY = null;
    let isDraggingSheet = false;

    function onPointerDown(e) {
      const touch = e.touches ? e.touches[0] : e;
      dragStart = { x: touch.clientX, y: touch.clientY };
      isDraggingSheet = false;
    }

    function onPointerMove(e) {
      if (!dragStart) return;
      const touch = e.touches ? e.touches[0] : e;
      const dx = touch.clientX - dragStart.x;
      const dy = touch.clientY - dragStart.y;

      if (!isDraggingSheet && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 6) {
        isDraggingSheet = true;
      }
      if (!isDraggingSheet) return;

      e.preventDefault();
      const base = -cur.idx * 100;
      const pct = (dx / track.parentElement.offsetWidth) * 100;
      // rubber band at edges
      let offset = pct;
      if ((cur.idx === 0 && dx > 0) || (cur.idx === cur.pages.length - 1 && dx < 0)) {
        offset = pct * 0.25;
      }
      track.classList.add('dragging');
      track.style.transform = `translateX(${base + offset}%)`;
    }

    function onPointerUp(e) {
      if (!dragStart || !isDraggingSheet) { dragStart = null; return; }
      const touch = e.changedTouches ? e.changedTouches[0] : e;
      const dx = touch.clientX - dragStart.x;
      const threshold = track.parentElement.offsetWidth * 0.28;

      track.classList.remove('dragging');
      if (dx < -threshold && cur.idx < cur.pages.length - 1) {
        setSlide(cur.idx + 1);
      } else if (dx > threshold && cur.idx > 0) {
        setSlide(cur.idx - 1);
      } else {
        setSlide(cur.idx);
      }
      dragStart = null;
      isDraggingSheet = false;
    }

    track.addEventListener('touchstart', onPointerDown, { passive: true });
    track.addEventListener('touchmove', onPointerMove, { passive: false });
    track.addEventListener('touchend', onPointerUp, { passive: true });
    track.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    // ── Drag sheet down to dismiss ─────────────────────────
    let sheetDrag = null;

    handleEl.addEventListener('touchstart', e => {
      sheetDrag = { y: e.touches[0].clientY, dismissed: false };
    }, { passive: true });

    handleEl.addEventListener('touchmove', e => {
      if (!sheetDrag) return;
      const dy = e.touches[0].clientY - sheetDrag.y;
      if (dy > 0) {
        sheet.style.transition = 'none';
        sheet.style.transform = `translateY(${dy}px)`;
      }
    }, { passive: true });

    handleEl.addEventListener('touchend', e => {
      if (!sheetDrag) return;
      const dy = e.changedTouches[0].clientY - sheetDrag.y;
      sheet.style.transition = '';
      sheet.style.transform = '';
      if (dy > 80) closeSheet();
      sheetDrag = null;
    }, { passive: true });

    // ── Keyboard ──────────────────────────────────────────
    document.addEventListener('keydown', e => {
      if (!isOpen) return;
      if (e.key === 'Escape') closeSheet();
      if (e.key === 'ArrowLeft' && cur.idx > 0) setSlide(cur.idx - 1);
      if (e.key === 'ArrowRight' && cur.idx < cur.pages.length - 1) setSlide(cur.idx + 1);
    });
  </script>
</body>
</html>
