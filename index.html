<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RORU — Modern Japanese Restaurant</title>
  <style>
    @font-face {
      font-family: 'Manrope';
      src: url('fonts/Manrope-ExtraLight.ttf') format('truetype');
      font-weight: 200;
    }
    @font-face {
      font-family: 'Manrope';
      src: url('fonts/Manrope-Light.ttf') format('truetype');
      font-weight: 300;
    }
    @font-face {
      font-family: 'Manrope';
      src: url('fonts/Manrope-SemiBold.ttf') format('truetype');
      font-weight: 600;
    }
    @font-face {
      font-family: 'Manrope';
      src: url('fonts/Manrope-Bold.ttf') format('truetype');
      font-weight: 700;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: #0a0a0a;
      color: #f0ede8;
      font-family: 'Manrope', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
    }

    /* ── Hero ───────────────────────────────────────────── */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background: url('images/omakase-1.jpg') center center / cover no-repeat;
      transform: scale(1.05);
      transition: transform 8s ease-out;
    }

    .hero-bg.loaded { transform: scale(1); }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom,
        rgba(10,10,10,0.5) 0%,
        rgba(10,10,10,0.3) 45%,
        rgba(10,10,10,0.75) 100%
      );
    }

    .hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-logo {
      width: clamp(100px, 16vw, 180px);
      height: auto;
      margin-bottom: 28px;
    }

    .hero-rule {
      width: 32px;
      height: 1px;
      background: rgba(240,237,232,0.45);
      margin: 0 auto 20px;
    }

    .hero-descriptor {
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(240,237,232,0.6);
      font-weight: 300;
    }

    .hero-slogan {
      margin-top: 32px;
      font-size: 10px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #e8534a;
      font-weight: 600;
    }

    .hero-scroll {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.2s;
      text-decoration: none;
    }

    .hero-scroll:hover { opacity: 1; }

    .hero-scroll span {
      font-size: 9px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #f0ede8;
      font-weight: 300;
    }

    .hero-scroll-line {
      width: 1px;
      height: 32px;
      background: #f0ede8;
      animation: scrollLine 1.6s ease-in-out infinite;
    }

    @keyframes scrollLine {
      0%, 100% { transform: scaleY(1); opacity: 0.6; }
      50% { transform: scaleY(0.35); opacity: 0.15; }
    }

    /* ── Menu section ───────────────────────────────────── */
    .menus {
      background: #0a0a0a;
      padding: 96px 40px;
    }

    .menus-header {
      text-align: center;
      margin-bottom: 64px;
    }

    .menus-header .label {
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #e8534a;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .menus-header h2 {
      font-size: clamp(28px, 4vw, 44px);
      font-weight: 200;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #f0ede8;
    }

    .menu-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .menu-card {
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .menu-card-img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }

    .menu-card:hover .menu-card-img {
      transform: scale(1.04);
    }

    .menu-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10,10,10,0.82) 0%, rgba(10,10,10,0.05) 55%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 28px 24px;
    }

    .menu-card-number {
      font-size: 10px;
      letter-spacing: 4px;
      color: #e8534a;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .menu-card-title {
      font-size: 18px;
      font-weight: 300;
      color: #f0ede8;
      line-height: 1.35;
      margin-bottom: 14px;
      letter-spacing: 0.5px;
    }

    .menu-card-cta {
      font-size: 9px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(240,237,232,0.6);
      font-weight: 300;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: color 0.2s;
    }

    .menu-card:hover .menu-card-cta { color: #f0ede8; }

    .menu-card-cta::after {
      content: '';
      display: block;
      width: 20px;
      height: 1px;
      background: currentColor;
      transition: width 0.3s ease;
    }

    .menu-card:hover .menu-card-cta::after { width: 36px; }

    /* ── Lightbox ───────────────────────────────────────── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(10,10,10,0.97);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    .lightbox-inner {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-img {
      max-height: 90vh;
      max-width: 78vw;
      width: auto;
      object-fit: contain;
      display: block;
      box-shadow: 0 32px 80px rgba(0,0,0,0.7);
      transition: opacity 0.18s ease;
    }

    .lightbox-img.fade { opacity: 0; }

    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 28px;
      background: none;
      border: none;
      color: rgba(240,237,232,0.5);
      font-size: 26px;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
      padding: 8px;
      font-family: 'Manrope', sans-serif;
      font-weight: 200;
    }

    .lightbox-close:hover { color: #f0ede8; }

    .lightbox-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 1px solid rgba(240,237,232,0.15);
      color: rgba(240,237,232,0.5);
      font-size: 22px;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .lightbox-arrow:hover {
      border-color: rgba(240,237,232,0.5);
      color: #f0ede8;
    }

    .lightbox-prev { left: 24px; }
    .lightbox-next { right: 24px; }

    .lightbox-dots {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
    }

    .lightbox-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(240,237,232,0.25);
      cursor: pointer;
      transition: background 0.2s;
      border: none;
      padding: 0;
    }

    .lightbox-dot.active { background: #e8534a; }

    .lightbox-label {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(240,237,232,0.35);
      white-space: nowrap;
      font-weight: 300;
    }

    /* ── Footer ─────────────────────────────────────────── */
    footer {
      background: #0a0a0a;
      border-top: 1px solid rgba(240,237,232,0.08);
      padding: 40px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .footer-logo {
      width: 52px;
      height: auto;
      opacity: 0.35;
    }

    footer p {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(240,237,232,0.3);
      font-weight: 300;
    }

    /* ── Responsive ─────────────────────────────────────── */
    @media (max-width: 768px) {
      .menu-cards { grid-template-columns: 1fr; gap: 2px; }
      .menus { padding: 72px 24px; }
      .lightbox-img { max-width: 95vw; max-height: 85vh; }
      .lightbox-arrow { display: none; }
    }

    @media (min-width: 481px) and (max-width: 768px) {
      .menu-cards { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <img class="hero-logo" src="logo-white.png" alt="RORU">
      <div class="hero-rule"></div>
      <p class="hero-descriptor">Modern Japanese Restaurant</p>
      <p class="hero-slogan">One Time, One Roll</p>
    </div>
    <a class="hero-scroll" href="#menus">
      <span>Menu</span>
      <div class="hero-scroll-line"></div>
    </a>
  </section>

  <!-- Menus -->
  <section class="menus" id="menus">
    <div class="menus-header">
      <p class="label">Our Menus</p>
      <h2>Explore</h2>
    </div>

    <div class="menu-cards">

      <div class="menu-card" onclick="openLightbox('omakase')">
        <img class="menu-card-img" src="images/omakase-1.jpg" alt="Omakase Spring Summer 2026">
        <div class="menu-card-overlay">
          <span class="menu-card-number">01</span>
          <h3 class="menu-card-title">Omakase<br>Spring Summer 2026</h3>
          <span class="menu-card-cta">View Menu</span>
        </div>
      </div>

      <div class="menu-card" onclick="openLightbox('alacarte')">
        <img class="menu-card-img" src="images/alacarte-1.jpg" alt="A La Carte Menu">
        <div class="menu-card-overlay">
          <span class="menu-card-number">02</span>
          <h3 class="menu-card-title">A La Carte<br>Menu</h3>
          <span class="menu-card-cta">View Menu</span>
        </div>
      </div>

      <div class="menu-card" onclick="openLightbox('drinks')">
        <img class="menu-card-img" src="images/drinks-1.jpg" alt="Drinks Menu">
        <div class="menu-card-overlay">
          <span class="menu-card-number">03</span>
          <h3 class="menu-card-title">Drinks<br>Menu</h3>
          <span class="menu-card-cta">View Menu</span>
        </div>
      </div>

    </div>
  </section>

  <footer>
    <img class="footer-logo" src="logo-white.png" alt="RORU">
    <p>Price excludes 5% service charge &amp; government taxes</p>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="handleLightboxClick(event)">
    <div class="lightbox-inner">
      <span class="lightbox-label" id="lightboxLabel"></span>
      <button class="lightbox-close" onclick="closeLightbox()">&#215;</button>
      <button class="lightbox-arrow lightbox-prev" onclick="changeSlide(-1)">&#8249;</button>
      <img class="lightbox-img" id="lightboxImg" src="" alt="">
      <button class="lightbox-arrow lightbox-next" onclick="changeSlide(1)">&#8250;</button>
      <div class="lightbox-dots" id="lightboxDots"></div>
    </div>
  </div>

  <script>
    const menus = {
      omakase: {
        label: 'Omakase — Spring Summer 2026',
        pages: [
          'images/omakase-1.jpg',
          'images/omakase-2.jpg',
          'images/omakase-3.jpg',
          'images/omakase-4.jpg',
          'images/omakase-5.jpg',
          'images/omakase-6.jpg',
        ]
      },
      alacarte: {
        label: 'A La Carte Menu',
        pages: ['images/alacarte-1.jpg', 'images/alacarte-2.jpg']
      },
      drinks: {
        label: 'Drinks Menu',
        pages: ['images/drinks-1.jpg', 'images/drinks-2.jpg']
      }
    };

    let current = { key: null, index: 0 };

    function openLightbox(key) {
      current = { key, index: 0 };
      renderLightbox();
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }

    function handleLightboxClick(e) {
      if (e.target === document.getElementById('lightbox')) closeLightbox();
    }

    function changeSlide(dir) {
      const pages = menus[current.key].pages;
      const img = document.getElementById('lightboxImg');
      img.classList.add('fade');
      setTimeout(() => {
        current.index = (current.index + dir + pages.length) % pages.length;
        renderLightbox();
        img.classList.remove('fade');
      }, 180);
    }

    function goToSlide(i) {
      const img = document.getElementById('lightboxImg');
      img.classList.add('fade');
      setTimeout(() => {
        current.index = i;
        renderLightbox();
        img.classList.remove('fade');
      }, 180);
    }

    function renderLightbox() {
      const menu = menus[current.key];
      document.getElementById('lightboxImg').src = menu.pages[current.index];
      document.getElementById('lightboxLabel').textContent = menu.label;
      const dots = document.getElementById('lightboxDots');
      dots.innerHTML = menu.pages.map((_, i) =>
        `<button class="lightbox-dot ${i === current.index ? 'active' : ''}" onclick="goToSlide(${i})"></button>`
      ).join('');
    }

    document.addEventListener('keydown', e => {
      if (!document.getElementById('lightbox').classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') changeSlide(-1);
      if (e.key === 'ArrowRight') changeSlide(1);
    });

    window.addEventListener('load', () => {
      document.getElementById('heroBg').classList.add('loaded');
    });
  </script>

</body>
</html>
